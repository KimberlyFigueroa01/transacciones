spring.application.name=transacciones

# Archivo donde se guardan los usuarios y su historial
banco.archivo=data/banco.json

# ---------- Timeouts ----------
# Tiempo máximo que el servidor espera a una operación COBOL (ms)
banco.cobol.timeout-ms=3000
# Retardo de prueba antes de llamar a la DLL (ms). 0 = sin retardo.
# Póngalo mayor que el timeout (p. ej. 4000) para provocar un timeout.
# También se puede cambiar en vivo desde el "Panel de pruebas" de la interfaz.
banco.cobol.retardo-ms=0
# Segundos sin actividad antes de cerrar la sesión
banco.sesion.inactividad-segundos=60
